[package]
edition.workspace = true
license.workspace = true
name = "codex-kimi-code"
version.workspace = true

[lib]
doctest = false
name = "codex_kimi_code"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-api = { workspace = true }
codex-chat-completions = { workspace = true }
